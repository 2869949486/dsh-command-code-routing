# Command Code (GOAT) provider, replacing the OpenCode pair.
#
# `commandcode` speaks the OpenAI chat-completions protocol
# (/provider/v1/chat/completions) and carries every model the plan actually
# serves. Command Code also exposes the Claude models over the Anthropic
# messages protocol (/provider/v1/messages), but only the two GOAT-eligible ones
# would apply, so the provider is left out until it is actually wanted: drop the
# `commandcode-anthropic` block back in to get them.
#
# The provider names the credential reference; the account pool rotates the value
# behind it, so a second key needs no config change.
#
# The insert is ONE entry: `dsh-command-code-routing` mounts the account pool /
# quota router and the usage dashboard together. `usage:` and `router:` hold the
# keys those two halves interpret differently (each one owns a `path`).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      commandcode:
        displayName: Command Code (GOAT)
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        apiKeyEnv: COMMANDCODE_API_KEY
        # Command Code bills its catalogue price and takes the plain OpenAI
        # field names; `store` is not part of its route, so it is not sent.
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          supportsStore: false
          thinkingFormat: openai
        models:
          - id: 'deepseek/deepseek-v4-flash'
            name: 'DeepSeek V4 Flash (latest)'
            contextWindow: 1000000
            maxTokens: 32000
            input: [text]
            reasoningEfforts:
