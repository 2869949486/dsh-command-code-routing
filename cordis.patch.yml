- insert:
    - id: command-code-router
      name: 'dsh-command-code-routing'
      config:
        vendor: commandcode
        apiBaseUrl: https://api.commandcode.ai
        apiKeyRef: COMMANDCODE_API_KEY
        usage:
          path: /command-code-usage
          plan: goat
          refreshSeconds: 60
        router:
          path: /command-code-quota-router
          probeIntervalMs: 1800000
          # Command Code publishes no status feed, so the card stays empty
          # instead of polling a URL that does not exist.
          statusUrl: null
          statusRefreshMs: 60000
          fallbackOnCapacity: true
          capacityFallbackDelayMs: 60000
          recoveryProbeIntervalMs: 60000
          recoverStableMs: 600000
          routes:
            - primary:
                provider: commandcode
                model: deepseek/deepseek-v4.1-flash
              fallback:
                provider: deepseek-account
                model: deepseek-flash
            - primary:
                provider: commandcode
                model: deepseek/deepseek-v4-pro
              fallback:
                provider: deepseek-account
                model: deepseek-v4-pro
